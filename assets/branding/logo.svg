<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Smooth macOS-style squircle clip -->
    <clipPath id="tile-clip">
      <path d="M140 16H372C452 16 496 60 496 140V372C496 452 452 496 372 496H140C60 496 16 452 16 372V140C16 60 60 16 140 16Z"/>
    </clipPath>

    <!-- Display screen clip -->
    <clipPath id="screen-clip">
      <rect x="88" y="112" width="336" height="216" rx="18"/>
    </clipPath>

    <!-- Half-plane clips for exact interlocking weave masks -->
    <clipPath id="clip-top-half">
      <rect x="0" y="0" width="512" height="220"/>
    </clipPath>
    <clipPath id="clip-bottom-half">
      <rect x="0" y="220" width="512" height="292"/>
    </clipPath>

    <!-- Masks for seamless over-under interlocking link -->
    <mask id="mask-left-ring" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect x="0" y="0" width="512" height="512" fill="#FFFFFF"/>
      <g clip-path="url(#clip-top-half)">
        <rect x="228" y="181" width="144" height="78" rx="39" fill="none" stroke="#000000" stroke-width="40"/>
      </g>
    </mask>
    <mask id="mask-right-ring" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect x="0" y="0" width="512" height="512" fill="#FFFFFF"/>
      <g clip-path="url(#clip-bottom-half)">
        <rect x="140" y="181" width="144" height="78" rx="39" fill="none" stroke="#000000" stroke-width="40"/>
      </g>
    </mask>

    <!-- Deep sapphire-navy tile background -->
    <linearGradient id="bg-grad" x1="256" y1="16" x2="256" y2="496" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#173461"/>
      <stop offset="50%" stop-color="#0D1E3D"/>
      <stop offset="100%" stop-color="#071124"/>
    </linearGradient>

    <!-- Restrained cool azure radial backlight -->
    <radialGradient id="bg-glow" cx="256" cy="212" r="244" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.44"/>
      <stop offset="55%" stop-color="#1D4ED8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#071124" stop-opacity="0"/>
    </radialGradient>

    <!-- Crisp subtle inner squircle rim -->
    <linearGradient id="tile-rim" x1="256" y1="16" x2="256" y2="496" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.40"/>
      <stop offset="35%" stop-color="#60A5FA" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.10"/>
    </linearGradient>

    <!-- Display aluminum-ice frame -->
    <linearGradient id="bezel-grad" x1="256" y1="92" x2="256" y2="348" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="52%" stop-color="#E6F0FC"/>
      <stop offset="100%" stop-color="#BFD6F0"/>
    </linearGradient>

    <!-- Sleek stand stem -->
    <linearGradient id="neck-grad" x1="256" y1="346" x2="256" y2="386" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#769BC5"/>
      <stop offset="34%" stop-color="#A5C3E3"/>
      <stop offset="100%" stop-color="#8DB0D6"/>
    </linearGradient>

    <!-- Sleek stand foot -->
    <linearGradient id="foot-grad" x1="256" y1="382" x2="256" y2="406" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5F9FF"/>
      <stop offset="100%" stop-color="#BED5EF"/>
    </linearGradient>

    <!-- Deep cobalt glass display surface -->
    <linearGradient id="screen-grad" x1="88" y1="112" x2="424" y2="328" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1E42"/>
      <stop offset="52%" stop-color="#112E63"/>
      <stop offset="100%" stop-color="#18448C"/>
    </linearGradient>

    <!-- Soft cyan glow behind link symbol -->
    <radialGradient id="screen-glow" cx="256" cy="220" r="154" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.32"/>
      <stop offset="65%" stop-color="#2563EB" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0B1E42" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle diagonal glass reflection -->
    <linearGradient id="glass-sheen" x1="88" y1="112" x2="310" y2="275" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0"/>
    </linearGradient>

    <!-- Left link ring (luminous sky-cyan) -->
    <linearGradient id="link-blue" x1="127" y1="168" x2="297" y2="272" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="48%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>

    <!-- Right link ring (crisp ice-white) -->
    <linearGradient id="link-white" x1="215" y1="168" x2="385" y2="272" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="62%" stop-color="#F0F7FF"/>
      <stop offset="100%" stop-color="#CBE2FC"/>
    </linearGradient>
  </defs>

  <!-- Squircle Tile Backdrop -->
  <g clip-path="url(#tile-clip)">
    <path d="M140 16H372C452 16 496 60 496 140V372C496 452 452 496 372 496H140C60 496 16 452 16 372V140C16 60 60 16 140 16Z" fill="url(#bg-grad)"/>
    <rect x="16" y="16" width="480" height="480" fill="url(#bg-glow)"/>
  </g>

  <!-- Subtle Inner Edge Rim -->
  <path d="M140 17.5H372C451.2 17.5 494.5 60.8 494.5 140V372C494.5 451.2 451.2 494.5 372 494.5H140C60.8 494.5 17.5 451.2 17.5 372V140C17.5 60.8 60.8 17.5 140 17.5Z" stroke="url(#tile-rim)" stroke-width="3"/>

  <!-- Subtle Grounding Shadow -->
  <rect x="68" y="104" width="376" height="256" rx="34" fill="#030814" fill-opacity="0.42"/>
  <rect x="172" y="390" width="168" height="22" rx="11" fill="#030814" fill-opacity="0.38"/>

  <!-- Minimalist Mac Display Stand -->
  <path d="M230 346H282L292 386H220L230 346Z" fill="url(#neck-grad)"/>
  <rect x="172" y="382" width="168" height="24" rx="12" fill="url(#foot-grad)"/>

  <!-- Mac Display Outer Frame -->
  <rect x="68" y="92" width="376" height="256" rx="34" fill="url(#bezel-grad)"/>

  <!-- Inner Glass Screen -->
  <g clip-path="url(#screen-clip)">
    <rect x="88" y="112" width="336" height="216" rx="18" fill="url(#screen-grad)"/>
    <rect x="88" y="112" width="336" height="216" fill="url(#screen-glow)"/>
    <path d="M88 112H334L210 328H88V112Z" fill="url(#glass-sheen)"/>
  </g>

  <!-- Crisp Inner Screen Edge -->
  <rect x="89" y="113" width="334" height="214" rx="17" stroke="#60A5FA" stroke-opacity="0.22" stroke-width="2"/>

  <!-- Interlocking Remote Link Symbol -->
  <rect x="140" y="181" width="144" height="78" rx="39" stroke="url(#link-blue)" stroke-width="26" mask="url(#mask-left-ring)"/>
  <rect x="228" y="181" width="144" height="78" rx="39" stroke="url(#link-white)" stroke-width="26" mask="url(#mask-right-ring)"/>
</svg>
